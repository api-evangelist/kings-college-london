- aid: kings-college-london:librarysearch-primo
  name: King's LibrarySearch (Ex Libris Primo)
  x-operator: tenant
  x-operator-evidence: >-
    librarysearch.kcl.ac.uk is a CNAME to kcl.primo.exlibrisgroup.com -> eu04.primo.exlibrisgroup.com.
    The discovery layer is Ex Libris Primo VE; the King's tenancy is identified by
    vid=44KCL_INST. King's has been an Ex Libris site since adopting Aleph in 1998.
  description: >-
    Library discovery for King's, on Ex Libris Primo. GET / returns 200 and redirects to
    /discovery/search?vid=44KCL_INST:44KCL_INST. Recorded as a tenancy because the catalog and
    the holdings are King's, but the Primo and Alma APIs behind it are Ex Libris's product and
    are documented on developers.exlibrisgroup.com, a host every Ex Libris customer shares. No
    contract is saved here.
