x-coverage:
  state: gated
  reason: >-
    King's operates exactly one public-internet API of its own, and it requires a King's
    credential. The e-Research AI Hub answers 401 with a structured error envelope, which proves
    it is live and callable, but its API reference, model list, rate limits and billing rules all
    sit behind Microsoft Entra ID sign-in and cannot be read from outside. The rest of the
    programmable footprint is either vendor software running under a kcl.ac.uk hostname or, in
    the case of the CREATE Cloud OpenStack API, on a hostname that publishes no public DNS at
    all. Nothing blocked us: 40+ hosts and paths were probed successfully and the thinness is the
    institution's, not a fetch failure.
  detail: >-
    Verified institution-operated and live: https://ai.create.kcl.ac.uk/api/v1/models returns 401
    application/json with the OpenAI error envelope
    ({"error":{"message":"Unauthorized — no bearer token provided","type":"invalid_request_error",
    "param":null,"code":"invalid_api_key"}}) from nginx/1.30.4, and a request bearing an unknown
    key returns a different message ("invalid API key"), which establishes the token is validated
    rather than merely required. King's own documentation at docs.er.kcl.ac.uk/CREATE/ai_hub/
    describes it as "King's College London's AI inference platform for researchers", OpenAI-
    compatible, with chat completions, image generation, streaming, RAG, agent workflows and MCP
    integration, free starter tokens and project budgets thereafter. No contract is published for
    it: /openapi.json, /api/openapi.json, /v1/models and /.well-known/openapi all return the
    application's 404. Institution-operated but unreachable: cloud.er.kcl.ac.uk, the CREATE Cloud
    OpenStack API documented at docs.er.kcl.ac.uk/CREATE/cloud/openstack_api/, has no public DNS
    record on 1.1.1.1 or 8.8.8.8 — it is VPN-only, and its application-credential and root-CA
    flow is documented but not probeable. Institution-authored but internal: the KCL e-Research
    Authentication API (github.com/kcl-eresearch/auth_api) documents its own REST surface for SSH
    keys, OpenVPN certificates and MFA requests in a public README, with no public base URL; and
    kcl-eresearch/artemis is a King's-authored Perplexity-compatible research API server. Neither
    ships an OpenAPI. Verified live but tenant-operated: kclpure.kcl.ac.uk (CNAME
    kings.elsevierpure.com), kcl.figshare.com (CNAME figshare.com), librarysearch.kcl.ac.uk
    (CNAME kcl.primo.exlibrisgroup.com), keats.kcl.ac.uk (CNAME kcl-vle.bloom.ulcc.ac.uk) and the
    UK federation IdP whose SSO endpoints are on login.openathens.net. Confirmed absent: no DNS
    for data.kcl.ac.uk, developer.kcl.ac.uk, courses.kcl.ac.uk, sis.kcl.ac.uk, idp.kcl.ac.uk or
    sso.kcl.ac.uk; api.kcl.ac.uk resolves to 137.73.130.161 but accepts no TCP connection on 80
    or 443 across three attempts at 30s, 40s and 60s; www.kcl.ac.uk/llms.txt and
    /.well-known/security.txt both 404. The development identity provider
    https://kclidpdev.kcl.ac.uk/idp/shibboleth is registered in the UK federation but carries the
    hide-from-discovery entity category and is treated as a placeholder, not a surface.
