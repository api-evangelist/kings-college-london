- aid: kings-college-london:pure-oai
  name: King's Research Portal (Pure) OAI-PMH
  x-operator: tenant
  x-operator-evidence: >-
    kclpure.kcl.ac.uk is a CNAME to kings.elsevierpure.com -> eu.prod.elsevierpure.com
    (-> cloudflare). That is a platform CNAME, not a CDN in front of a King's origin: the
    repository software, the hosting and the OAI implementation are Elsevier Pure's. The records,
    the adminEmail puresupport@kcl.ac.uk and the 50-year publication history are King's.
  description: >-
    The standards-based harvesting interface for the King's Research Portal, the front end of
    Pure — how King's research outputs reach OpenAIRE, CORE, BASE and the rest of the aggregator
    layer. Identify returns repositoryName "Pure OAI Repository", protocolVersion 2.0,
    earliestDatestamp 2014-10-22, granularity to the second and deletedRecord no.
    ListMetadataFormats returns six prefixes — oai_dc, qdc, mods, uketd_dc, xmetadiss and
    nl_didl, the fourth being the UK electronic theses profile. ListSets returns persons:all,
    publications:all, publications:withFiles and a per-year publication set running from 1972.
    The envelope declares the OpenAIRE CERIF 1.2 profile. Fully open, no credential. A legacy
    path at /ws/OAIHandler answers 405; the canonical base URL is /ws/oai. No OpenAPI is saved:
    the protocol is OAI's and the implementation is Elsevier's.
  humanURL: https://www.kcl.ac.uk/research/explore/kings-research-portal
  baseURL: https://kclpure.kcl.ac.uk/ws/oai
