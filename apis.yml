- aid: kings-college-london:figshare-repository
  name: King's College London Research Data Repository (Figshare tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    kcl.figshare.com is a CNAME straight to figshare.com. This is the relationship the June 2026
    profile mistook for a King's API: ten OpenAPI contracts and eleven apis[] entries were saved
    here for api.figshare.com/v2, the generic Figshare host that twenty-five universities in this
    catalog claimed simultaneously, and all eleven were removed on 2026-08-19. The tenancy itself
    is recorded because it is real and it is King's: DataCite provider HCBR, repository BL.KCL,
    prefix 10.18742, 1,118 DOIs published with publisher "King's College London" and landing
    pages on kcl.figshare.com.
  description: >-
    King's research data repository, operated for King's by Figshare. The data, the DOIs, the
    DataCite membership and the curation decisions are King's; the REST API, the OAI-PMH endpoint
    and every line of the contract that describes them are Figshare's, and they score against
    Figshare's own repo, not this one. Recorded as a relationship rather than as a set of
    contracts — the deliberate output of the operator check, and the reason this profile's Kin
    Score falls relative to its June 2026 value.
  humanURL: https://kcl.figshare.com/
  tags:
  - Research Data
  - Institutional Repository
  - Open Data
  - DataCite
  - Figshare
