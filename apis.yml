- aid: kings-college-london:keats-moodle
  name: KEATS Virtual Learning Environment (Moodle) web services
  x-operator: tenant
  x-operator-evidence: >-
    keats.kcl.ac.uk is a CNAME to kcl-vle.bloom.ulcc.ac.uk -> kcl-vle-cluster.kcl.cdl.cosector.com.
    The VLE is Moodle, hosted and operated by ULCC/Cosector. The courses and the enrolments are
    King's.
  description: >-
    King's VLE exposes the standard Moodle machine interfaces on a King's hostname:
    /webservice/rest/server.php answers 200 with an XML `invalidtoken` fault, /lib/ajax/service.php
    answers 200 with a JSON error envelope, and the LTI authorization endpoint /mod/lti/auth.php
    answers 200. There is no LTI 1.3 platform JWKS and no OIDC discovery document —
    /.well-known/openid-configuration returns 404 — so LTI conformance is recorded as partial.
    Recorded because it is a live, tokenised API surface under kcl.ac.uk, not because King's
    authored any of it.
  humanURL: https://keats.kcl.ac.uk/
