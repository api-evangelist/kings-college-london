aid: kings-college-london
name: King's College London
x-type: university
x-category: Public Research University
description: >-
  King's College London is a UK public research university and Russell Group member, founded in
  1829, ranked #40 in the QS World University Rankings. Re-profiled on 2026-08-19 under the API
  Evangelist university pipeline, which settles WHO OPERATES a surface before crediting it to the
  institution. The June 2026 profile credited King's with eleven API entries and ten OpenAPI
  contracts; every one of them was api.figshare.com/v2 — a single Figshare document that the same
  pass attributed to twenty-five different universities — split by tag into eleven apparent
  surfaces. Those contracts, and the collections and agentic-access artifacts derived from them,
  have been removed. What is left is what King's actually operates. The genuine find is the
  e-Research AI Hub at ai.create.kcl.ac.uk: King's own OpenAI-compatible LLM inference platform
  for researchers, live, bearer-authenticated, metered and billed, running on King's own
  infrastructure — a real institution-operated API, and a rare one in this cohort. Alongside it
  sit four tenancies that are real institutional facts but somebody else's engineering: the
  King's Research Portal OAI-PMH endpoint (Elsevier Pure), the research data repository
  (Figshare), LibrarySearch (Ex Libris Primo) and the UK federation identity provider
  (OpenAthens). King's holds its own DataCite membership and prefix, and is registered in the UK
  Access Management Federation and eduGAIN. It publishes no OpenAPI, no developer portal, no
  open data portal, no llms.txt and no security.txt.
