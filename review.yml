        note: >-
          Contains entityID https://kclidp.kcl.ac.uk/idp/shibboleth, SIRTFI-certified,
          scope kcl.ac.uk, SSO endpoints on login.openathens.net — TENANT.
      - url: https://api.datacite.org/providers/hcbr
        status: 200
        note: >-
