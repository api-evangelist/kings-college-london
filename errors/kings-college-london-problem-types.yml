note: >-
  Recorded from live responses, not from a specification — King's publishes no OpenAPI for any
  surface. The e-Research AI Hub returns the OpenAI error envelope verbatim, which is the
  correct choice for a platform whose stated value proposition is that any OpenAI client works
  by changing base_url and api_key. It is not RFC 9457 problem+json and does not claim to be.
  Only two error shapes could be observed without a credential; nothing further is asserted.
